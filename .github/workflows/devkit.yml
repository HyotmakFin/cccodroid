# 开发工具包：从 Termux 官方仓库构建，发布到 Release。
# 推 tag devkit-YYYY.MM.DD 触发；App 按 devkit-sources.txt 里钉的 tag 下载。
# 在公开 CI 上构建，任何人都能复现、核对每个包的来源（见 devkit.lock.json / SBOM.tsv）。
name: devkit

on:
  push:
    tags: ['devkit-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # 签名钥匙 INDEX_SIGNING_KEY 只存在这个 Environment 里（不放仓库级 secret）：每次跑都要维护者在 Actions 页点批准，
    # 别的工作流引用不到它。环境的部署规则只放行 devkit-* tag（审计 M-2b）
    environment: devkit-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '22'

      # 先出模块划分（冻结这一刻的包记录），整包和各块都按它打 —— 同一个 Release 一定出自同一份快照
      - name: 模块划分
        run: node devkit/devkit.mjs modules --out out

      - name: 构建整包（下载 .deb → 校验 → 等长改前缀 → tar → gzip）
        run: node devkit/devkit.mjs build --target cc.codroid --plan out/modules.plan.json --out out --cache cache

      # 0.3.9 起的 App 认 modules.json，按块装；旧 App 继续用上面的整包
      - name: 构建各模块（deb 已在缓存里）
        run: |
          node devkit/devkit.mjs modules --plan out/modules.plan.json --build --target cc.codroid --out out/modules --cache cache
          rm out/modules/*.tar
          cp out/modules.plan.json out/modules/

      # modules.json 签名（和组件索引同一把钥匙）：App 更新工具包时验它，对不上就退回整包
      - name: 签名 modules.json
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: node scripts/sign-modules.mjs out/modules/modules.json

      # 「经加载器」（targetSdk 36）的 APK 要从这个 glibc 包里抽 ld.so（devkit.mjs ldso）。Termux 仓库在 glibc 升版后会删掉旧包，
      # 所以随 Release 存一份，锁文件里的 sha256 照样核
      - name: 留存 glibc 包
        run: |
          G=$(node -p "require('path').basename(require('./out/devkit.lock.json').packages.find((p) => p.name === 'glibc').file).replace(/:/g, '%3a')")
          cp "cache/$G" out/glibc.deb

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/devkit-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          GZ_SHA=$(node -p "require('./out/devkit.lock.json').gz.sha256")
          SNAP=$(node -p "require('./out/devkit.lock.json').snapshot")
          N=$(node -p "require('./out/devkit.lock.json').packages.length")
          cat > notes.md <<NOTES
          **简体中文** · [English](#english)

          cccodroid 开发工具包（$N 个组件），取自 Termux 官方仓库，仅做等长前缀改写（com.termux → cc.codroid）。

          - 仓库快照：$SNAP
          - \`devkit-cc.codroid.tar.gz\` sha256：\`$GZ_SHA\`
          - 每个组件的版本、哈希、构建配方：\`devkit.lock.json\` / \`SBOM.tsv\`
          - 模块化（cccodroid 0.3.9 起按需装）：\`modules.json\` 列出各模块与 sha256，各块 \`devkit-<模块>-cc.codroid.tar.gz\`

          **源码**：各组件按其自身许可证分发（含 GPL 等）。构建配方见 [termux-packages](https://github.com/termux/termux-packages)，
          上游源码地址见各配方的 \`build.sh\`；需要本版本对应源码副本的，请在 Issues 中提出。

          ---

          ## English

          cccodroid toolchain ($N components) taken from the official Termux repositories, with only a same-length prefix relocation (com.termux → cc.codroid).

          - Repository snapshot: $SNAP
          - \`devkit-cc.codroid.tar.gz\` sha256: \`$GZ_SHA\`
          - Version, hash and build recipe of every component: \`devkit.lock.json\` / \`SBOM.tsv\`
          - Modular (cccodroid 0.3.9+ installs on demand): \`modules.json\` lists the modules and their sha256; one \`devkit-<module>-cc.codroid.tar.gz\` per module

          **Source**: each component is distributed under its own license (including GPL). Build recipes are in [termux-packages](https://github.com/termux/termux-packages),
          and each recipe's \`build.sh\` names the upstream source; if you need a copy of the source matching this release, ask in Issues.
          NOTES
          gh release create "$TAG" --title "$TAG" --notes-file notes.md \
            out/devkit-cc.codroid.tar.gz out/devkit.lock.json out/SBOM.tsv \
            out/modules/*.tar.gz out/modules/module-*.lock.json out/modules/SBOM-*.tsv out/modules/modules.json out/modules/modules.json.sig out/glibc.deb
