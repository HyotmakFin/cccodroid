# 开发工具包：从 Termux 官方仓库构建，发布到 Release。
# 推 tag devkit-YYYY.MM.DD 触发；App 按 devkit-sources.txt 里钉的 tag 下载。
# 在公开 CI 上构建，任何人都能复现、核对每个包的来源（见 devkit.lock.json / SBOM.tsv）。
name: devkit

on:
  push:
    tags: ['devkit-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建（下载 .deb → 校验 → 等长改前缀 → tar → gzip）
        run: node devkit/devkit.mjs build --target cc.codroid --out out --cache cache

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/devkit-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          GZ_SHA=$(node -p "require('./out/devkit.lock.json').gz.sha256")
          SNAP=$(node -p "require('./out/devkit.lock.json').snapshot")
          N=$(node -p "require('./out/devkit.lock.json').packages.length")
          cat > notes.md <<NOTES
          **简体中文** · [English](#english)

          cccodroid 开发工具包（$N 个组件），取自 Termux 官方仓库，仅做等长前缀改写（com.termux → cc.codroid）。

          - 仓库快照：$SNAP
          - \`devkit-cc.codroid.tar.gz\` sha256：\`$GZ_SHA\`
          - 每个组件的版本、哈希、构建配方：\`devkit.lock.json\` / \`SBOM.tsv\`

          **源码**：各组件按其自身许可证分发（含 GPL 等）。构建配方见 [termux-packages](https://github.com/termux/termux-packages)，
          上游源码地址见各配方的 \`build.sh\`；需要本版本对应源码副本的，请在 Issues 中提出。

          ---

          ## English

          cccodroid toolchain ($N components) taken from the official Termux repositories, with only a same-length prefix relocation (com.termux → cc.codroid).

          - Repository snapshot: $SNAP
          - \`devkit-cc.codroid.tar.gz\` sha256: \`$GZ_SHA\`
          - Version, hash and build recipe of every component: \`devkit.lock.json\` / \`SBOM.tsv\`

          **Source**: each component is distributed under its own license (including GPL). Build recipes are in [termux-packages](https://github.com/termux/termux-packages),
          and each recipe's \`build.sh\` names the upstream source; if you need a copy of the source matching this release, ask in Issues.
          NOTES
          gh release create "$TAG" --title "$TAG" --notes-file notes.md \
            out/devkit-cc.codroid.tar.gz out/devkit.lock.json out/SBOM.tsv
